        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .badge-QB { background: #ef4444; color: #fff; }
        .badge-WR { background: #3b82f6; color: #fff; }
        .badge-RB { background: #10b981; color: #fff; }

        .badge-K { background: #8b5cf6; color: #fff; }
        .badge-DEF { background: #64748b; color: #fff; }
        .btn-draft { background: #16a34a; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; padding: 6px 12px; }
        .btn-draft:hover { background: #15803d; }
        .vorp-positive { color: #4ade80; font-weight: bold; }
        .vorp-negative { color: #f87171; }
    </style>
</head>

    let currentPosFilter = 'ALL';

    // CALCULATE SCORING BY POSITION
    function calculatePts(p) {
        if (p.pos === 'K') return parseFloat(((p.fgYds * 0.10) + (p.pat * 1.0)).toFixed(2));
        if (p.pos === 'DEF') return parseFloat(p.pts.toFixed(2));
        let pass = ((p.passYds || 0) * 0.02) + ((p.passTd || 0) * 6.0) + ((p.int || 0) * -2.0);
        let rush = ((p.rushYds || 0) * 0.10) + ((p.rushTd || 0) * 6.0);
        let rec  = ((p.rec || 0) * 0.50) + ((p.recYds || 0) * 0.10) + ((p.recTd || 0) * 6.0);
        let fum  = ((p.fum || 0) * -2.0);
        return parseFloat((pass + rush + rec + fum).toFixed(2));
    }

    // INITIALIZE ENGINE & BASELINES
    function initEngine() {
        players.forEach(p => {
            p.pts = calculatePts(p);
            p.drafted = false;
        });

        let baselines = {};
        Object.keys(BASELINES).forEach(pos => {
            let posPlayers = players.filter(p => p.pos === pos).sort((a,b) => b.pts - a.pts);
            let rank = BASELINES[pos];
            baselines[pos] = posPlayers[rank - 1] ? posPlayers[rank - 1].pts : (posPlayers[posPlayers.length - 1] ? posPlayers[posPlayers.length - 1].pts : 0);
        });

        players.forEach(p => {
            p.vorp = parseFloat((p.pts - baselines[p.pos]).toFixed(2));
        });

        renderTable();
    }

    function setPosFilter(pos) {
        currentPosFilter = pos;
        document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderTable();
    }

    function draftPlayer(name) {
        let p = players.find(x => x.name === name);
        if (p) p.drafted = true;
        renderTable();
    }

    function renderTable() {
        let tbody = document.getElementById('playerTable');
        let search = document.getElementById('searchInput').value.toLowerCase();
        tbody.innerHTML = '';

        let available = players
            .filter(p => !p.drafted)
            .filter(p => currentPosFilter === 'ALL' || p.pos === currentPosFilter)
            .filter(p => p.name.toLowerCase().includes(search))
            .sort((a,b) => b.vorp - a.vorp);

        available.forEach((p, index) => {
            let vorpClass = p.vorp >= 0 ? 'vorp-positive' : 'vorp-negative';
            let row = `
                <tr>
                    <td>#${index + 1}</td>
                    <td><strong>${p.name}</strong></td>
                    <td><span class="badge badge-${p.pos}">${p.pos}</span></td>
                    <td>${p.pts}</td>
                    <td class="${vorpClass}">${p.vorp > 0 ? '+' + p.vorp : p.vorp}</td>
                    <td><button class="btn-draft" onclick="draftPlayer('${p.name}')">Draft</button></td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    initEngine();
