name: Sync Live Fantasy Projections

on:
  schedule:
    - cron: '0 6 * * *' # Runs every day at 6 AM UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Run Projection Sync Script
        run: |
          pip install requests
          python sync_data.py
          
      - name: Commit and push updated projections.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add projections.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Sync: Updated projections & depth charts" && git push)
